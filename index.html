<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Successful Ivy Essays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>Ivy Essays</h1>
                <p>The Collection</p>
            </div>
            <nav id="chapter-list">
                <!-- Chapters will be injected here -->
            </nav>
        </aside>

        <main class="content-area">
            <div id="essay-display" class="essay-container">
                <!-- Essay content will be injected here -->
                <div class="placeholder">
                    <h2>Select a Chapter</h2>
                    <p>Begin your journey into the minds of successful applicants.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
